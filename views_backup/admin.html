<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GoodLeaders Admin Panel</title>
<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    padding:20px;
}
.container{
    max-width:700px;
    margin:auto;
}
.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}
input, textarea{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
}
button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Admin Panel</h2>

        <h3>Add Leadership Advice</h3>

        <form action="/admin/post" method="POST">

<input
    type="text"
    name="title"
    placeholder="Title"
    required
>

<textarea
    name="content"
    rows="6"
    placeholder="Write leadership advice here..."
    required
></textarea>

<button type="submit">Publish</button>

</form>
    </div>
</div>

</body>
</html>
