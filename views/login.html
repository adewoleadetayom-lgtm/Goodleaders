<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - GoodLeaders</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0d6efd,#4facfe);
}

.container{
    background:#fff;
    width:360px;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    color:#0d6efd;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

.register-link{
    text-align:center;
    margin-top:20px;
}

.register-link a{
    color:#0d6efd;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>Welcome Back</h2>
<p>Sign in to your GoodLeaders account.</p>

<form action="/login" method="POST">

<input type="email" name="email" placeholder="Email Address" required>

<input type="password" name="password" placeholder="Password" required>

<div style="text-align:right;margin:4px 0 12px;">
<a href="/forgot-password"
   style="color:#0d6efd;text-decoration:none;font-weight:bold;font-size:14px;">
Forgot Password?
</a>
</div>

<button type="submit">Login</button>

</form>

<div class="register-link">
Don't have an account?
<a href="/register">Register</a>
</div>

</div>

</body>
</html>
